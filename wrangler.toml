name = "kr-stock-worker"
main = "worker/src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ───────────── 바인딩 ─────────────
[[d1_databases]]
binding = "DB"
database_name = "kr-stock-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"   # wrangler d1 create kr-stock-db 결과값
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"           # wrangler kv namespace create CACHE 결과값

# ───────────── 환경변수 (비밀 아님) ─────────────
[vars]
APP_ENV = "production"
PRICE_PROVIDER = "naver"        # naver | kis | mock
ADMIN_EMAIL = ""                # §8.1-2 소스 변경 감지 알림 수신 주소
MAIL_FROM_NAME = "주식 차트분석 알림"
# 개발 환경에서 Cloudflare Access 헤더가 없을 때 사용할 사용자 식별자
DEV_USER = "dev@local"
# Cloudflare Pages 배포 도메인 (CORS 허용 출처, 쉼표 구분). 미설정 시 "*"
WEB_ORIGIN = ""

# ───────────── Cron Triggers (UTC 기준 — §8.2) ─────────────
# 05:00 KST  종목마스터(KRX) 적재 → KV 캐시 (§3.4)
# 장중 10분  분봉 축적 (§3.5 범위 제한)
# 16:00 KST  일봉 적재 + analysis_cache 사전 계산 (§2.2-1)
# 18:00 KST  F9 시그널 사후 채점  ★명세 원문 `0 9 * * 1-5`
# 장중 30분  F10 손절/목표 도달 알림 ★명세 원문 `*/30 0-6 * * 1-5`
[triggers]
crons = [
  "0 20 * * *",
  "*/10 0-6 * * 1-5",
  "0 7 * * 1-5",
  "0 9 * * 1-5",
  "*/30 0-6 * * 1-5"
]

[observability]
enabled = true

[observability.logs]
enabled = true
